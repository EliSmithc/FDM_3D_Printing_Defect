[project]
name = "fdm-defect"
version = "0.1.0"
description = "Defect classification for FDM 3D printing timelapse frames"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
